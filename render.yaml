services:
  - type: web
    name: empty-shop-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_DATABASE
        value: shoppingonline
      - key: CLIENT_URL
        value: https://empty-shop-customer.onrender.com

  - type: web
    name: empty-shop-customer
    runtime: static
    rootDir: client-customer
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://empty-shop-api-on6v.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: empty-shop-admin
    runtime: static
    rootDir: client-admin
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://empty-shop-api-on6v.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

